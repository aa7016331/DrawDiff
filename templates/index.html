<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DrawDiff｜圖面差異自動核對</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                "Microsoft JhengHei",
                Arial,
                sans-serif;
            background: #f3f6f8;
            color: #17212b;
        }

        header {
            background: #152534;
            color: white;
            padding: 32px 5%;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #c7d2dc;
        }

        .container {
            width: 94%;
            max-width: 1600px;
            margin: 30px auto 60px auto;
        }

        .card {
            background: white;
            border: 1px solid #d9e1e6;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
        }

        .upload-grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 25px;
        }

        .upload-box {
            border:
                2px dashed #b7c8d3;
            border-radius: 16px;
            min-height: 170px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .upload-box h3 {
            margin: 0 0 10px 0;
        }

        .upload-box p {
            color: #71808b;
            margin-top: 0;
        }

        input[type="file"] {
            max-width: 100%;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 28px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #analyzeBtn {
            background: #168371;
            color: white;
        }

        #exportBtn {
            background: #435563;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-top: 18px;
            font-size: 16px;
        }

        .hidden {
            display: none;
        }

        .summary {
            display: inline-block;
            background: #eef3f5;
            border-radius: 30px;
            padding: 10px 18px;
            margin-bottom: 20px;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 25px;
        }

        .image-panel {
            border: 1px solid #d9e1e6;
            border-radius: 15px;
            overflow: hidden;
            background: #fafcfd;
        }

        .image-title {
            padding: 14px;
            text-align: center;
            font-weight: bold;
            background: #edf2f5;
            font-size: 18px;
        }

        .image-wrap {
            padding: 15px;
            overflow: auto;
            text-align: center;
            max-height: 850px;
        }

        .image-wrap img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: auto;
        }

        .diff-section {
            margin-top: 30px;
        }

        .diff-image {
            width: 100%;
            border: 1px solid #d9e1e6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #edf2f5;
        }

        th,
        td {
            padding: 12px;
            border-bottom:
                1px solid #dce4e8;
            text-align: center;
        }

        .number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #d62828;
            color: white;
            font-weight: bold;
        }

        @media (
            max-width: 850px
        ) {

            .upload-grid,
            .comparison-grid {
                grid-template-columns:
                    1fr;
            }

            header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>

    <header>

        <h1>
            DrawDiff｜
            圖面差異自動核對
        </h1>

        <p>
            上傳原始圖與修改後圖，
            系統將直接在兩張圖面上標示差異位置
        </p>

    </header>


    <main class="container">


        <!-- 上傳 -->

        <section class="card">

            <h2>上傳圖面</h2>

            <div class="upload-grid">


                <div class="upload-box">

                    <h3>原始圖</h3>

                    <p>
                        JPG、PNG、PDF
                    </p>

                    <input
                        id="oldFile"
                        type="file"
                        accept="
                            image/png,
                            image/jpeg,
                            application/pdf
                        "
                    >

                </div>


                <div class="upload-box">

                    <h3>修改後圖</h3>

                    <p>
                        JPG、PNG、PDF
                    </p>

                    <input
                        id="newFile"
                        type="file"
                        accept="
                            image/png,
                            image/jpeg,
                            application/pdf
                        "
                    >

                </div>


            </div>


            <div class="buttons">

                <button
                    id="analyzeBtn"
                >
                    開始自動核對
                </button>


                <button
                    id="exportBtn"
                    disabled
                >
                    匯出 CSV
                </button>

            </div>


            <div id="status">

                請先上傳兩張圖面

            </div>

        </section>



        <!-- 結果 -->

        <section
            id="resultSection"
            class="card hidden"
        >

            <h2>核對結果</h2>


            <div
                id="summary"
                class="summary"
            >
            </div>


            <!-- 左右對照 -->

            <div class="comparison-grid">


                <div class="image-panel">

                    <div class="image-title">

                        原始圖
                        （紅框為差異位置）

                    </div>

                    <div class="image-wrap">

                        <img
                            id="oldResult"
                            alt="原始圖差異標記"
                        >

                    </div>

                </div>



                <div class="image-panel">

                    <div class="image-title">

                        修改後圖
                        （紅框為差異位置）

                    </div>

                    <div class="image-wrap">

                        <img
                            id="newResult"
                            alt="修改後圖差異標記"
                        >

                    </div>

                </div>


            </div>


            <!-- 差異遮罩 -->

            <div class="diff-section">

                <h3>
                    差異辨識區域
                </h3>

                <img
                    id="diffResult"
                    class="diff-image"
                    alt="差異辨識圖"
                >

            </div>



            <!-- 明細 -->

            <h3>
                差異明細
            </h3>


            <table>

                <thead>

                    <tr>

                        <th>編號</th>

                        <th>差異項目</th>

                        <th>X</th>

                        <th>Y</th>

                        <th>寬度</th>

                        <th>高度</th>

                        <th>差異面積</th>

                    </tr>

                </thead>


                <tbody
                    id="resultBody"
                >
                </tbody>

            </table>


        </section>


    </main>



    <script>

        let resultRows = [];


        const oldFile =
            document.getElementById(
                "oldFile"
            );


        const newFile =
            document.getElementById(
                "newFile"
            );


        const analyzeBtn =
            document.getElementById(
                "analyzeBtn"
            );


        const exportBtn =
            document.getElementById(
                "exportBtn"
            );


        const status =
            document.getElementById(
                "status"
            );


        const resultSection =
            document.getElementById(
                "resultSection"
            );


        analyzeBtn.addEventListener(
            "click",
            async () => {

                if (
                    !oldFile.files[0]
                    ||
                    !newFile.files[0]
                ) {

                    alert(
                        "請同時選擇原始圖與修改後圖"
                    );

                    return;

                }


                const formData =
                    new FormData();


                formData.append(
                    "old",
                    oldFile.files[0]
                );


                formData.append(
                    "new",
                    newFile.files[0]
                );


                analyzeBtn.disabled = true;

                exportBtn.disabled = true;


                status.textContent =
                    "正在比對圖面，請稍候...";


                try {

                    const response =
                        await fetch(
                            "/analyze",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            data.error
                            ||
                            "核對失敗"
                        );

                    }


                    resultRows =
                        data.rows;


                    document.getElementById(
                        "oldResult"
                    ).src =
                        data.old_image;


                    document.getElementById(
                        "newResult"
                    ).src =
                        data.new_image;


                    document.getElementById(
                        "diffResult"
                    ).src =
                        data.diff_image;


                    document.getElementById(
                        "summary"
                    ).textContent =
                        "共找到 "
                        +
                        data.count
                        +
                        " 個差異位置";


                    renderTable(
                        data.rows
                    );


                    resultSection.classList.remove(
                        "hidden"
                    );


                    exportBtn.disabled = false;


                    status.textContent =
                        "核對完成";

                }

                catch (error) {

                    status.textContent =
                        "核對失敗：" +
                        error.message;

                    alert(
                        error.message
                    );

                }

                finally {

                    analyzeBtn.disabled = false;

                }

            }
        );



        function renderTable(rows) {

            const body =
                document.getElementById(
                    "resultBody"
                );


            body.innerHTML = "";


            rows.forEach(
                row => {

                    const tr =
                        document.createElement(
                            "tr"
                        );


                    tr.innerHTML = `

                        <td>

                            <span class="number">

                                ${row.id}

                            </span>

                        </td>


                        <td>

                            ${row.name}

                        </td>


                        <td>

                            ${row.x}

                        </td>


                        <td>

                            ${row.y}

                        </td>


                        <td>

                            ${row.width}

                        </td>


                        <td>

                            ${row.height}

                        </td>


                        <td>

                            ${row.area}

                        </td>

                    `;


                    body.appendChild(
                        tr
                    );

                }
            );

        }



        exportBtn.addEventListener(
            "click",
            async () => {

                if (
                    resultRows.length === 0
                ) {

                    alert(
                        "目前沒有核對結果"
                    );

                    return;

                }


                const response =
                    await fetch(
                        "/export",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    {
                                        rows:
                                            resultRows
                                    }
                                )
                        }
                    );


                const blob =
                    await response.blob();


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );


                a.href = url;

                a.download =
                    "DrawDiff.csv";


                document.body.appendChild(
                    a
                );


                a.click();


                a.remove();


                URL.revokeObjectURL(
                    url
                );

            }
        );

    </script>


</body>

</html>
