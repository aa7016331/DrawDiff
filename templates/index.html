<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrawDiff</title><style>
:root{--ink:#18232d;--accent:#1d7a68;--line:#dce3e8;--bg:#f4f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}header{background:var(--ink);color:#fff;padding:20px 5%}.brand{font-size:25px;font-weight:800}.sub{font-size:13px;opacity:.72;margin-top:5px}main{max-width:1280px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:22px}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:18px}.drop{border:2px dashed #b7c5cc;border-radius:14px;padding:28px;text-align:center;background:#fbfcfc}.drop small{display:block;color:#70808a;margin:8px}button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px 25px;font-size:16px;font-weight:700;cursor:pointer}.secondary{background:#44535d;margin-left:10px}.actions{text-align:center;margin-top:20px}#status{text-align:center;margin-top:14px;min-height:20px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th{background:#eef3f5;text-align:left;padding:12px}td{padding:9px 12px;border-bottom:1px solid #e7ecef}.sym{width:68px;height:52px;object-fit:contain}.num{text-align:center;font-size:17px}.plus{color:#087a43;font-weight:800}.minus{color:#bd3030;font-weight:800}.zero{color:#687780;font-weight:700}.pill{display:inline-block;background:#f1f5f6;padding:8px 13px;border-radius:999px;margin-right:8px}@media(max-width:700px){.uploads{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">DrawDiff｜圖面符號數量核對</div><div class="sub">固定圖例辨識 · 原始圖與修改圖自動比較</div></header><main>
<div class="card"><h2>上傳圖面</h2><div class="uploads"><div class="drop"><b>原始圖</b><small>JPG、PNG、PDF</small><input id="old" type="file" accept=".jpg,.jpeg,.png,.bmp,.tif,.tiff,.pdf"></div><div class="drop"><b>修改後圖</b><small>JPG、PNG、PDF</small><input id="new" type="file" accept=".jpg,.jpeg,.png,.bmp,.tif,.tiff,.pdf"></div></div><div class="actions"><button id="go">開始自動核對</button><button class="secondary" id="download">匯出 CSV</button></div><div id="status"></div></div>
<div class="card"><h2>核對結果</h2><div id="summary"><span class="pill">尚未分析</span></div><div class="tablewrap"><table><thead><tr><th>圖案</th><th>設備／功能</th><th>原圖</th><th>新圖</th><th>增減</th></tr></thead><tbody>{% for item in items %}<tr data-id="{{loop.index0}}"><td><img class="sym" src="/static/symbols/{{loop.index0}}.png"></td><td>{{item}}</td><td class="num old">—</td><td class="num new">—</td><td class="num diff">—</td></tr>{% endfor %}</tbody></table></div></div></main>
<script>let rows=[];const status=document.getElementById("status"),go=document.getElementById("go");go.onclick=async()=>{const a=document.getElementById("old").files[0],b=document.getElementById("new").files[0];if(!a||!b){alert("請同時選擇兩張圖");return}const fd=new FormData();fd.append("old",a);fd.append("new",b);go.disabled=true;status.textContent="正在辨識並計算…";try{const r=await fetch("/analyze",{method:"POST",body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);rows=d.rows;let p=0,m=0;rows.forEach(x=>{const tr=document.querySelector('tr[data-id="'+x.id+'"]');tr.querySelector(".old").textContent=x.old;tr.querySelector(".new").textContent=x.new;const c=tr.querySelector(".diff");c.textContent=x.diff>0?"+"+x.diff:x.diff;c.className="num diff "+(x.diff>0?"plus":x.diff<0?"minus":"zero");if(x.diff>0)p+=x.diff;if(x.diff<0)m-=x.diff});document.getElementById("summary").innerHTML='<span class="pill">增加 '+p+' 個</span><span class="pill">減少 '+m+' 個</span>';status.textContent="核對完成"}catch(e){status.textContent="";alert(e.message)}finally{go.disabled=false}};document.getElementById("download").onclick=async()=>{if(!rows.length){alert("請先完成分析");return}const r=await fetch("/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rows})}),b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="DrawDiff結果.csv";a.click();URL.revokeObjectURL(u)}</script></body></html>
