<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        DrawDiff｜圖面差異核對
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                "Microsoft JhengHei",
                "Noto Sans TC",
                Arial,
                sans-serif;

            background: #f3f6f8;

            color: #132333;
        }


        header {

            background: #152532;

            color: white;

            padding:
                32px
                7%;
        }


        header h1 {

            margin: 0 0 8px;

            font-size: 32px;
        }


        header p {

            margin: 0;

            color: #c8d2d9;
        }


        main {

            max-width: 1400px;

            margin: 35px auto;

            padding: 0 25px;
        }


        .card {

            background: white;

            border: 1px solid #d8e1e6;

            border-radius: 18px;

            padding: 35px;

            margin-bottom: 30px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.03);
        }


        h2 {

            margin-top: 0;
        }


        .upload-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 25px;
        }


        .upload-box {

            min-height: 190px;

            border:
                2px dashed
                #b8cad5;

            border-radius: 16px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 25px;

            text-align: center;

            background: #fbfdfe;
        }


        .upload-box strong {

            font-size: 20px;

            margin-bottom: 8px;
        }


        .hint {

            color: #718190;

            margin-bottom: 15px;
        }


        input[type="file"] {

            max-width: 100%;
        }


        .actions {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 25px;

            flex-wrap: wrap;
        }


        button {

            border: 0;

            border-radius: 12px;

            padding:
                15px
                25px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform .15s,
                opacity .15s;
        }


        button:hover {

            transform:
                translateY(-1px);
        }


        button:disabled {

            opacity: .55;

            cursor: wait;
        }


        .primary {

            background: #16816f;

            color: white;
        }


        .secondary {

            background: #435766;

            color: white;
        }


        #status {

            text-align: center;

            margin-top: 18px;

            font-weight: bold;
        }


        .error {

            color: #c62828;
        }


        .success {

            color: #087c55;
        }


        #result {

            display: none;
        }


        .summary {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            background: #eef5f6;

            padding:
                10px
                16px;

            border-radius: 999px;

            margin-bottom: 25px;

            font-weight: bold;
        }


        .compare-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 25px;
        }


        .image-panel {

            border: 1px solid #ccd9df;

            border-radius: 12px;

            padding: 15px;

            background: #fafcfd;
        }


        .image-title {

            text-align: center;

            font-weight: bold;

            margin-bottom: 12px;
        }


        .image-panel img {

            display: block;

            width: 100%;

            height: auto;

            border: 1px solid #e0e6e9;

            background: white;
        }


        .table-wrap {

            overflow-x: auto;

            margin-top: 30px;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            background: white;
        }


        th {

            background: #eaf1f4;

            padding: 12px;

            text-align: left;
        }


        td {

            padding: 12px;

            border-bottom:
                1px solid
                #e2e9ed;
        }


        .number {

            display: inline-flex;

            justify-content: center;

            align-items: center;

            width: 28px;

            height: 28px;

            border-radius: 50%;

            background: #e52323;

            color: white;

            font-weight: bold;
        }


        @media (
            max-width: 800px
        ) {

            .upload-grid,
            .compare-grid {

                grid-template-columns:
                    1fr;
            }


            header {

                padding:
                    25px;
            }


            main {

                padding:
                    0 12px;
            }


            .card {

                padding:
                    20px;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>
        DrawDiff｜圖面差異核對
    </h1>

    <p>
        自動對齊原始圖與修改後圖，左右同步標記差異位置
    </p>

</header>


<main>


    <!-- ================================================= -->
    <!-- 上傳 -->
    <!-- ================================================= -->

    <section class="card">

        <h2>
            上傳圖面
        </h2>


        <div class="upload-grid">


            <div class="upload-box">

                <strong>
                    原始圖
                </strong>

                <div class="hint">
                    JPG、PNG、PDF
                </div>

                <input
                    id="oldFile"
                    type="file"
                    accept=".jpg,.jpeg,.png,.bmp,.tif,.tiff,.pdf"
                >

            </div>


            <div class="upload-box">

                <strong>
                    修改後圖
                </strong>

                <div class="hint">
                    JPG、PNG、PDF
                </div>

                <input
                    id="newFile"
                    type="file"
                    accept=".jpg,.jpeg,.png,.bmp,.tif,.tiff,.pdf"
                >

            </div>


        </div>


        <div class="actions">

            <button
                id="analyzeButton"
                class="primary"
            >
                開始自動核對
            </button>


            <button
                id="exportButton"
                class="secondary"
                disabled
            >
                匯出 CSV
            </button>

        </div>


        <div id="status">
        </div>


    </section>


    <!-- ================================================= -->
    <!-- 結果 -->
    <!-- ================================================= -->

    <section
        id="result"
        class="card"
    >


        <h2>
            核對結果
        </h2>


        <div
            id="summary"
            class="summary"
        >
            尚未分析
        </div>


        <!-- 左右對照 -->

        <div class="compare-grid">


            <div class="image-panel">

                <div class="image-title">
                    原始圖（紅框為差異位置）
                </div>

                <img
                    id="oldResult"
                    alt="原始圖差異標記"
                >

            </div>


            <div class="image-panel">

                <div class="image-title">
                    修改後圖（紅框為差異位置）
                </div>

                <img
                    id="newResult"
                    alt="修改後圖差異標記"
                >

            </div>


        </div>


        <!-- 差異表 -->

        <div class="table-wrap">


            <table>

                <thead>

                    <tr>

                        <th>
                            差異
                        </th>

                        <th>
                            X
                        </th>

                        <th>
                            Y
                        </th>

                        <th>
                            寬度
                        </th>

                        <th>
                            高度
                        </th>

                        <th>
                            差異面積
                        </th>

                    </tr>

                </thead>


                <tbody id="resultRows">

                </tbody>


            </table>


        </div>


    </section>


</main>


<script>


    let latestRows = [];


    const oldFile =
        document.getElementById(
            "oldFile"
        );


    const newFile =
        document.getElementById(
            "newFile"
        );


    const analyzeButton =
        document.getElementById(
            "analyzeButton"
        );


    const exportButton =
        document.getElementById(
            "exportButton"
        );


    const status =
        document.getElementById(
            "status"
        );


    // =====================================================
    // 開始分析
    // =====================================================

    analyzeButton.addEventListener(
        "click",
        async () => {


            if (
                !oldFile.files.length
                ||
                !newFile.files.length
            ) {

                status.textContent =
                    "請同時選擇原始圖與修改後圖";

                status.className =
                    "error";

                return;
            }


            const formData =
                new FormData();


            formData.append(
                "old",
                oldFile.files[0]
            );


            formData.append(
                "new",
                newFile.files[0]
            );


            analyzeButton.disabled =
                true;


            exportButton.disabled =
                true;


            status.textContent =
                "正在裁切、尋找共同特徵並自動對齊圖面…";


            status.className =
                "";


            try {


                const response =
                    await fetch(
                        "/analyze",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error
                        ||
                        "分析失敗"
                    );
                }


                document.getElementById(
                    "oldResult"
                ).src =
                    data.old_image;


                document.getElementById(
                    "newResult"
                ).src =
                    data.new_image;


                document.getElementById(
                    "summary"
                ).textContent =
                    "共找到 "
                    +
                    data.difference_count
                    +
                    " 個差異";


                latestRows =
                    data.rows;


                renderRows(
                    data.rows
                );


                document.getElementById(
                    "result"
                ).style.display =
                    "block";


                exportButton.disabled =
                    false;


                status.textContent =
                    "核對完成";


                status.className =
                    "success";


                document.getElementById(
                    "result"
                ).scrollIntoView(
                    {
                        behavior: "smooth",
                        block: "start"
                    }
                );


            }
            catch (error) {


                status.textContent =
                    error.message;


                status.className =
                    "error";

            }
            finally {


                analyzeButton.disabled =
                    false;

            }


        }
    );


    // =====================================================
    // 顯示差異列表
    // =====================================================

    function renderRows(rows) {


        const tbody =
            document.getElementById(
                "resultRows"
            );


        tbody.innerHTML =
            "";


        if (
            !rows.length
        ) {


            tbody.innerHTML =
                `
                <tr>
                    <td
                        colspan="6"
                    >
                        沒有偵測到明顯差異
                    </td>
                </tr>
                `;


            return;
        }


        rows.forEach(
            row => {


                const tr =
                    document.createElement(
                        "tr"
                    );


                tr.innerHTML =
                    `
                    <td>
                        <span class="number">
                            ${row.id}
                        </span>
                    </td>

                    <td>
                        ${row.x}
                    </td>

                    <td>
                        ${row.y}
                    </td>

                    <td>
                        ${row.width}
                    </td>

                    <td>
                        ${row.height}
                    </td>

                    <td>
                        ${row.area}
                    </td>
                    `;


                tbody.appendChild(
                    tr
                );


            }
        );


    }


    // =====================================================
    // 匯出 CSV
    // =====================================================

    exportButton.addEventListener(
        "click",
        async () => {


            if (
                !latestRows.length
            ) {

                alert(
                    "目前沒有差異資料可以匯出"
                );

                return;
            }


            try {


                const response =
                    await fetch(
                        "/export",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    {
                                        rows:
                                            latestRows
                                    }
                                )
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "CSV 匯出失敗"
                    );
                }


                const blob =
                    await response.blob();


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );


                a.href =
                    url;


                a.download =
                    "DrawDiff.csv";


                document.body.appendChild(
                    a
                );


                a.click();


                a.remove();


                URL.revokeObjectURL(
                    url
                );


            }
            catch (error) {


                alert(
                    error.message
                );

            }


        }
    );


</script>


</body>

</html>
